steps:
  # Build the container image with the Build Argument
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build -t gcr.io/$PROJECT_ID/odat \
          --build-arg NEXT_PUBLIC_CONVEX_URL=${_NEXT_PUBLIC_CONVEX_URL} \
          .

  # Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/odat']

  # Deploy to Cloud Run automatically
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'odat'
      - '--image'
      - 'gcr.io/$PROJECT_ID/odat'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _NEXT_PUBLIC_CONVEX_URL: https://brainy-capybara-304.convex.cloud
